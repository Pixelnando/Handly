/* ==========================================================================
   Handly — design tokens
   Única fonte de cores do sistema. Nenhum outro arquivo (CSS ou JS) usa cor literal:
   tudo referencia estes tokens. Razões de contraste verificadas por tests/contrast_check.py
   (lê este arquivo) e documentadas em docs/DESIGN_TOKENS.md.
   ========================================================================== */
:root {
  color-scheme: dark;

  /* 1. Paleta de marca (valores definidos pelo projeto) ---------------------- */
  --hd-card: #2c2c2c;          /* base de cards, menus, formulários e painéis */
  --hd-text: #f4f0e4;          /* texto padrão */
  --hd-red-light: #ec8f8d;     /* vermelho claro */
  --hd-red-dark: #b45656;      /* vermelho escuro */
  --hd-green-light: #44a194;   /* verde claro */
  --hd-green-dark: #286b74;    /* verde escuro */
  --hd-bg-start: #1e1e1e;
  --hd-bg-end: #290f18;
  --hd-bg: linear-gradient(180deg, var(--hd-bg-start) 0%, var(--hd-bg-end) 100%);

  /* Separadores: cor clara com 12%–16% de opacidade */
  --hd-sep-12: rgb(244 240 228 / 0.12);
  --hd-sep: rgb(244 240 228 / 0.14);
  --hd-sep-16: rgb(244 240 228 / 0.16);

  /* 2. Derivados sólidos (misturas da própria paleta; sem opacidade em texto) -- */
  --hd-text-muted: color-mix(in srgb, var(--hd-text) 74%, var(--hd-card));      /* texto secundário */
  --hd-card-raised: color-mix(in srgb, var(--hd-text) 6%, var(--hd-card));      /* superfícies elevadas */
  --hd-card-hover: color-mix(in srgb, var(--hd-text) 11%, var(--hd-card));
  --hd-field-bg: var(--hd-bg-start);                                           /* fundo de campos */
  --hd-control-border: color-mix(in srgb, var(--hd-text) 46%, var(--hd-card));  /* borda de controles (≥ 3:1) */

  /* 3. Ações — fundo + foreground por estado (contraste calculado por estado) -- */
  /* Primária: #ec8f8d → hover #b45656 */
  --hd-primary-bg: var(--hd-red-light);
  --hd-primary-fg: var(--hd-bg-start);          /* 7,05:1 */
  --hd-primary-bg-hover: var(--hd-red-dark);
  --hd-primary-fg-hover: #fdfcfa;               /* 4,65:1 — exceção documentada: o creme #f4f0e4 só atinge 4,18:1 */
  /* Positiva: #44a194 → hover #286b74 */
  --hd-positive-bg: var(--hd-green-light);
  --hd-positive-fg: var(--hd-bg-start);         /* 5,38:1 */
  --hd-positive-bg-hover: var(--hd-green-dark);
  --hd-positive-fg-hover: var(--hd-text);       /* 5,35:1 */
  /* Destrutiva: vermelho escuro → hover mais escuro (o contraste só aumenta) */
  --hd-danger-bg: var(--hd-red-dark);
  --hd-danger-fg: var(--hd-primary-fg-hover);   /* 4,65:1 */
  --hd-danger-bg-hover: color-mix(in srgb, var(--hd-red-dark) 72%, var(--hd-bg-start));
  --hd-danger-fg-hover: var(--hd-primary-fg-hover);
  /* Secundária (contorno) */
  --hd-secondary-fg: var(--hd-text);
  --hd-secondary-border: var(--hd-control-border);
  --hd-secondary-bg-hover: var(--hd-card-hover);
  /* Desabilitado */
  --hd-disabled-bg: color-mix(in srgb, var(--hd-text) 10%, var(--hd-card));
  --hd-disabled-fg: color-mix(in srgb, var(--hd-text) 58%, var(--hd-card));

  /* Estados semânticos (selos) */
  --hd-chip-pending-bg: var(--hd-card-raised);
  --hd-chip-pending-fg: var(--hd-text);
  --hd-chip-pending-border: var(--hd-red-light);
  --hd-chip-positive-bg: var(--hd-green-dark);
  --hd-chip-positive-fg: var(--hd-text);
  --hd-chip-active-border: var(--hd-green-light);
  --hd-chip-negative-bg: var(--hd-red-dark);
  --hd-chip-negative-fg: var(--hd-primary-fg-hover);
  --hd-chip-neutral-bg: var(--hd-card-raised);
  --hd-chip-neutral-fg: var(--hd-text-muted);
  --hd-error-text: var(--hd-red-light);          /* sobre card: 5,91:1 */
  --hd-success-bg: var(--hd-green-dark);
  --hd-success-fg: var(--hd-text);

  /* Foco: anel visível e idêntico em botões, campos, links e controles */
  --hd-focus: var(--hd-text);
  --hd-focus-width: 2px;
  --hd-focus-offset: 2px;

  /* Ícones decorativos (nunca aplicar a texto ou ícones informativos) */
  --hd-icon-op-strong: 0.7;
  --hd-icon-op-mid: 0.4;
  --hd-icon-op-faint: 0.24;

  /* 4. Escalas ---------------------------------------------------------------- */
  --hd-font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --hd-radius-sm: 8px;
  --hd-radius: 14px;
  --hd-radius-lg: 20px;
  --hd-shadow: 0 10px 34px rgb(0 0 0 / 0.38);
  --hd-shadow-sm: 0 2px 10px rgb(0 0 0 / 0.3);
  --hd-space-1: 4px;
  --hd-space-2: 8px;
  --hd-space-3: 12px;
  --hd-space-4: 16px;
  --hd-space-5: 24px;
  --hd-space-6: 32px;
  --hd-space-7: 48px;
  --hd-container: 1120px;
  --hd-header-h: 64px;
}

/* Base: reset, tipografia, links, foco e utilitários de layout */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { animation-duration: 0.001ms !important; transition-duration: 0.001ms !important; } }

body {
  margin: 0;
  min-height: 100vh;
  font-family: var(--hd-font);
  font-size: 1rem;
  line-height: 1.55;
  color: var(--hd-text);
  background: var(--hd-bg);
  background-attachment: fixed;
  background-color: var(--hd-bg-start);
}

h1, h2, h3, h4 { margin: 0 0 var(--hd-space-3); line-height: 1.2; font-weight: 650; letter-spacing: -0.01em; }
h1 { font-size: clamp(1.7rem, 1.2rem + 2vw, 2.4rem); }
h2 { font-size: 1.35rem; }
h3 { font-size: 1.1rem; }
h4 { font-size: 1rem; }
p { margin: 0 0 var(--hd-space-3); }
small, .small { font-size: 0.875rem; }
.muted { color: var(--hd-text-muted); }
.strong { font-weight: 650; }
.center { text-align: center; }
.nowrap { white-space: nowrap; }
hr, .sep { border: 0; border-top: 1px solid var(--hd-sep); margin: var(--hd-space-4) 0; }
ul, ol { margin: 0; padding-left: 1.2rem; }

/* Links herdam o tema; sublinhado em hover e foco */
a { color: inherit; text-decoration: none; }
a:hover, a:focus-visible { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1.5px; }
a.link { color: var(--hd-red-light); font-weight: 600; }

/* Foco visível e consistente (alvos de foco programático — títulos/main — não mostram anel) */
[tabindex="-1"]:focus, [tabindex="-1"]:focus-visible { outline: none; }
:where(a, button, input, select, textarea, summary, [tabindex]):focus { outline: none; }
:where(a, button, input, select, textarea, summary, [tabindex], [role="button"]):focus-visible {
  outline: var(--hd-focus-width) solid var(--hd-focus);
  outline-offset: var(--hd-focus-offset);
  border-radius: var(--hd-radius-sm);
}
.skip-link {
  position: absolute; left: var(--hd-space-3); top: -60px; z-index: 100;
  background: var(--hd-primary-bg); color: var(--hd-primary-fg); padding: var(--hd-space-2) var(--hd-space-4);
  border-radius: var(--hd-radius-sm); font-weight: 650;
}
.skip-link:focus { top: var(--hd-space-3); }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }

/* Layout */
.container { width: 100%; max-width: var(--hd-container); margin-inline: auto; padding-inline: var(--hd-space-4); }
.page { padding-block: var(--hd-space-5) var(--hd-space-7); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: var(--hd-space-3); margin-bottom: var(--hd-space-5); }
.page-head p { margin: 0; }
.stack { display: flex; flex-direction: column; gap: var(--hd-space-4); }
.stack-sm { display: flex; flex-direction: column; gap: var(--hd-space-2); }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: var(--hd-space-3); }
.row.between { justify-content: space-between; }
.row.end { justify-content: flex-end; }
.grow { flex: 1 1 0; min-width: 0; }
.grid { display: grid; gap: var(--hd-space-4); }
.grid.cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.grid.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.grid.cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.grid.auto { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.split { display: grid; gap: var(--hd-space-5); grid-template-columns: 320px minmax(0, 1fr); align-items: start; }
.split.reverse { grid-template-columns: minmax(0, 1fr) 340px; }
@media (max-width: 900px) {
  .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .split, .split.reverse { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 600px) {
  .grid.cols-2, .grid.cols-3, .grid.cols-4 { grid-template-columns: minmax(0, 1fr); }
  .page { padding-block: var(--hd-space-4) var(--hd-space-6); }
}
.hidden { display: none !important; }

/* Componentes: botões, campos, cards, selos, tabelas, chat, calendário, avisos.
   Somente tokens (var(--hd-*)); nenhuma cor literal neste arquivo. */

/* ---------- Cabeçalho e navegação ---------- */
.site-header { position: sticky; top: 0; z-index: 40; background: var(--hd-card); border-bottom: 1px solid var(--hd-sep); }
.site-header .container { display: flex; align-items: center; gap: var(--hd-space-4); min-height: var(--hd-header-h); }
.brand { display: inline-flex; align-items: center; gap: var(--hd-space-2); font-weight: 750; font-size: 1.35rem; letter-spacing: -0.02em; }
.brand:hover, .brand:focus-visible { text-decoration: none; }
.brand img { width: 30px; height: 30px; display: block; }
.brand .dot { color: var(--hd-red-light); }
.nav { display: flex; align-items: center; gap: var(--hd-space-1); flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav a { padding: var(--hd-space-2) 10px; border-radius: var(--hd-radius-sm); white-space: nowrap; color: var(--hd-text-muted); font-weight: 560; }
.nav a:hover { color: var(--hd-text); background: var(--hd-card-hover); }
.nav a[aria-current="page"] { color: var(--hd-text); background: var(--hd-card-raised); box-shadow: inset 0 -2px 0 var(--hd-red-light); border-radius: var(--hd-radius-sm) var(--hd-radius-sm) 0 0; }
.header-actions { display: flex; align-items: center; gap: var(--hd-space-2); margin-left: auto; }
.badge-count { display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; font-size: 0.75rem; font-weight: 700;
  background: var(--hd-primary-bg); color: var(--hd-primary-fg); margin-left: var(--hd-space-1); }
.menu { position: relative; }
.menu-panel { position: absolute; right: 0; top: calc(100% + 8px); min-width: 230px; background: var(--hd-card); border: 1px solid var(--hd-sep-16);
  border-radius: var(--hd-radius); box-shadow: var(--hd-shadow); padding: var(--hd-space-2); z-index: 50; }
.menu-panel a, .menu-panel button { display: block; width: 100%; text-align: left; padding: var(--hd-space-2) var(--hd-space-3); border-radius: var(--hd-radius-sm);
  background: none; border: 0; color: var(--hd-text); font: inherit; cursor: pointer; }
.menu-panel a:hover, .menu-panel button:hover { background: var(--hd-card-hover); text-decoration: none; }
.menu-panel .sep { margin: var(--hd-space-2) 0; }
.menu-head { padding: var(--hd-space-2) var(--hd-space-3); }
@media (max-width: 760px) {
  .site-header .container { flex-wrap: wrap; padding-block: var(--hd-space-2); }
  .nav { order: 3; flex-basis: 100%; }
}

.banner { padding: var(--hd-space-3) var(--hd-space-4); border-bottom: 1px solid var(--hd-sep); background: var(--hd-card-raised); text-align: center; }
.banner strong { color: var(--hd-red-light); }

/* ---------- Cards e painéis ---------- */
.card { background: var(--hd-card); border: 1px solid var(--hd-sep); border-radius: var(--hd-radius); padding: var(--hd-space-5); box-shadow: var(--hd-shadow-sm); }
.card.tight { padding: var(--hd-space-4); }
.card.flush { padding: 0; overflow: hidden; }
.card > h2:first-child, .card > h3:first-child { margin-bottom: var(--hd-space-4); }
.card.link-card { display: block; transition: background .15s, border-color .15s; }
.card.link-card:hover { background: var(--hd-card-hover); border-color: var(--hd-sep-16); text-decoration: none; }
.card-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: var(--hd-space-2); margin-bottom: var(--hd-space-3); }
.card-head h3 { margin: 0; }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .num { font-size: 1.9rem; font-weight: 750; line-height: 1.1; }
.stat .lbl { color: var(--hd-text-muted); font-size: 0.9rem; }
.kv { display: grid; grid-template-columns: max-content 1fr; gap: var(--hd-space-1) var(--hd-space-4); margin: 0; }
.kv dt { color: var(--hd-text-muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
@media (max-width: 480px) { .kv { grid-template-columns: 1fr; } .kv dt { margin-top: var(--hd-space-2); } }

/* ---------- Botões ---------- */
.btn {
  --_bg: var(--hd-secondary-bg-hover); --_fg: var(--hd-secondary-fg); --_bg-h: var(--hd-secondary-bg-hover); --_fg-h: var(--hd-secondary-fg);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--hd-space-2);
  min-height: 44px; padding: 0 var(--hd-space-5); border-radius: var(--hd-radius-sm); border: 1px solid transparent;
  font: inherit; font-weight: 650; line-height: 1.1; cursor: pointer; text-align: center;
  background: var(--_bg); color: var(--_fg); transition: background-color .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--_bg-h); color: var(--_fg-h); text-decoration: none; }
.btn:focus-visible { text-decoration: none; }
.btn-primary { --_bg: var(--hd-primary-bg); --_fg: var(--hd-primary-fg); --_bg-h: var(--hd-primary-bg-hover); --_fg-h: var(--hd-primary-fg-hover); }
.btn-positive { --_bg: var(--hd-positive-bg); --_fg: var(--hd-positive-fg); --_bg-h: var(--hd-positive-bg-hover); --_fg-h: var(--hd-positive-fg-hover); }
.btn-danger { --_bg: var(--hd-danger-bg); --_fg: var(--hd-danger-fg); --_bg-h: var(--hd-danger-bg-hover); --_fg-h: var(--hd-danger-fg-hover); }
.btn-outline { --_bg: transparent; border-color: var(--hd-secondary-border); }
.btn-ghost { --_bg: transparent; --_bg-h: var(--hd-card-hover); padding-inline: var(--hd-space-3); }
.btn-sm { min-height: 36px; padding: 0 var(--hd-space-4); font-size: 0.9rem; }
.btn-block { width: 100%; }
.btn[disabled], .btn[aria-disabled="true"] { background: var(--hd-disabled-bg); color: var(--hd-disabled-fg); border-color: transparent; cursor: not-allowed; }
.btn .spinner { width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.icon { width: 1.15em; height: 1.15em; flex: none; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.icon.deco-strong { opacity: var(--hd-icon-op-strong); }
.icon.deco-mid { opacity: var(--hd-icon-op-mid); }
.icon.deco-faint { opacity: var(--hd-icon-op-faint); }

/* ---------- Formulários ---------- */
.field { display: flex; flex-direction: column; gap: var(--hd-space-1); min-width: 0; }
.field > label, .legend { font-weight: 600; font-size: 0.95rem; }
.field .hint { color: var(--hd-text-muted); font-size: 0.85rem; }
.field .err { color: var(--hd-error-text); font-size: 0.875rem; font-weight: 560; }
.req { color: var(--hd-red-light); margin-left: 2px; }
.input, .select, .textarea {
  width: 100%; min-height: 44px; padding: 10px var(--hd-space-3); font: inherit; color: var(--hd-text);
  background: var(--hd-field-bg); border: 1px solid var(--hd-control-border); border-radius: var(--hd-radius-sm);
  transition: border-color .15s;
}
.textarea { min-height: 96px; resize: vertical; }
.input::placeholder, .textarea::placeholder { color: var(--hd-text-muted); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--hd-text); }
.input[aria-invalid="true"], .select[aria-invalid="true"], .textarea[aria-invalid="true"] { border-color: var(--hd-red-light); border-width: 2px; padding: 9px calc(var(--hd-space-3) - 1px); }
.input:disabled, .select:disabled, .textarea:disabled { background: var(--hd-disabled-bg); color: var(--hd-disabled-fg); cursor: not-allowed; }
.select { appearance: none; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--hd-text) 50%), linear-gradient(135deg, var(--hd-text) 50%, transparent 50%);
  background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%; background-size: 5px 5px; background-repeat: no-repeat; }
.select option { background: var(--hd-card); color: var(--hd-text); }
input[type="checkbox"], input[type="radio"] { width: 20px; height: 20px; accent-color: var(--hd-green-light); margin: 0; flex: none; }
.check { display: flex; align-items: center; gap: var(--hd-space-2); min-height: 32px; cursor: pointer; }
.check-group { display: flex; flex-wrap: wrap; gap: var(--hd-space-2) var(--hd-space-4); }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
.form-grid { display: grid; gap: var(--hd-space-4); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 640px) { .form-grid { grid-template-columns: minmax(0, 1fr); } }
.form-actions { display: flex; flex-wrap: wrap; gap: var(--hd-space-3); justify-content: flex-end; margin-top: var(--hd-space-5); }
.filters { display: grid; gap: var(--hd-space-3); grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); align-items: end; }

.pw-wrap { position: relative; }
.pw-wrap .input { padding-right: 76px; }
.pw-toggle { position: absolute; right: 4px; top: 4px; min-height: 36px; padding: 0 var(--hd-space-3); background: none; border: 0; color: var(--hd-text); font: inherit; font-size: 0.85rem; cursor: pointer; border-radius: var(--hd-radius-sm); }
.pw-toggle:hover { background: var(--hd-card-hover); }

.autocomplete { position: relative; }
.suggestions { position: absolute; left: 0; right: 0; top: calc(100% + 4px); z-index: 20; background: var(--hd-card); border: 1px solid var(--hd-sep-16);
  border-radius: var(--hd-radius-sm); box-shadow: var(--hd-shadow); max-height: 240px; overflow: auto; }
.suggestions button { display: block; width: 100%; text-align: left; padding: var(--hd-space-2) var(--hd-space-3); background: none; border: 0; color: var(--hd-text); font: inherit; cursor: pointer; }
.suggestions button:hover, .suggestions button[aria-selected="true"] { background: var(--hd-card-hover); }

/* ---------- Selos e avaliações ---------- */
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 650; line-height: 1.6;
  background: var(--hd-chip-neutral-bg); color: var(--hd-chip-neutral-fg); border: 1px solid var(--hd-sep-16); white-space: nowrap; }
.chip.pending { background: var(--hd-chip-pending-bg); color: var(--hd-chip-pending-fg); border-color: var(--hd-chip-pending-border); }
.chip.positive { background: var(--hd-chip-positive-bg); color: var(--hd-chip-positive-fg); border-color: var(--hd-chip-active-border); }
